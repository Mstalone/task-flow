name: SAST - Semgrep

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sast:
    name: Analise Estatica de Seguranca
    runs-on: ubuntu-latest

    steps:
      - name: Obter codigo
        uses: actions/checkout@v4

      - name: Instalar Semgrep
        run: python -m pip install semgrep

      - name: Executar analise SAST
        run: semgrep scan --config p/javascript --config p/security-audit --error src/
