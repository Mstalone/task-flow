
name: DAST - OWASP ZAP

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  dast:
    name: Analise Dinamica de Seguranca
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      # Obter o codigo do repositorio
      - name: Obter codigo
        uses: actions/checkout@v4

      # Configurar o ambiente Node.js
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Instalar as dependencias do projeto
      - name: Instalar dependencias
        run: npm ci

      # Iniciar a aplicacao TaskFlow em segundo plano
      - name: Iniciar TaskFlow
        run: |
          npm start > /tmp/taskflow.log 2>&1 &
          echo $! > /tmp/taskflow.pid

      # Confirmar que a aplicacao esta disponivel
      - name: Verificar disponibilidade da aplicacao
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/health; then
              echo "TaskFlow disponivel"
              exit 0
            fi

            sleep 2
          done

          echo "Erro: TaskFlow nao iniciou corretamente."
          cat /tmp/taskflow.log
          exit 1

      # Preparar a pasta para guardar os relatorios
      - name: Preparar pasta de relatorios
        run: |
          mkdir -p zap-reports
          chmod 777 zap-reports

      # Executar a analise dinamica com OWASP ZAP
      - name: Executar OWASP ZAP Baseline
        run: |
          docker run --rm \
            --network host \
            -v "${{ github.workspace }}/zap-reports:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://127.0.0.1:3000 \
            -r zap_report.html \
            -I

      # Guardar o relatorio HTML da analise DAST
      - name: Guardar relatorio DAST
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-dast-zap
          path: zap-reports/zap_report.html
          if-no-files-found: error
